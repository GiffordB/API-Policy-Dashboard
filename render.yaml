# Render blueprint: the scheduled collection.
#
# This job does NOT talk to the database. It asks the app to collect, over
# HTTP, with the shared secret.
#
# An earlier version ran the collector here, which meant this job needed its own
# DATABASE_URL. A blueprint-declared database then re-pointed that variable on
# every sync, the app and the collector ended up on different databases, and the
# failure surfaced as a missing table — which reads like a broken migration
# rather than a wiring mistake. Two places knowing how to reach the database was
# the root cause, so now only one does.
#
# This job knows two things: where the app is, and the shared secret.

services:
  - type: cron
    name: collect-federal-register
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    # Hourly, on the hour, in UTC. The Federal Register publishes one issue per
    # business day, so most runs find nothing — that is fine, they cost seconds.
    # To skip the quiet overnight runs: "0 11,14,17,20 * * 1-5".
    schedule: "0 * * * *"
    # Nothing to build. The script is plain Node with no dependencies.
    buildCommand: "echo no build needed"
    startCommand: node scripts/trigger.mjs
    envVars:
      - key: APP_URL
        sync: false          # https://your-app.vercel.app
      - key: COLLECT_SECRET
        sync: false          # the same value as the Vercel project
      - key: COLLECT_DAYS
        value: "3"
      # File new arrivals in the same run. The Anthropic key lives on the app,
      # not here — this job never needs it.
      - key: CLASSIFY_AFTER_COLLECT
        value: "1"
      - key: CLASSIFY_CAP
        value: "25"
      # State legislatures, paused pending a decision on the data source.
      # Set to "1" to resume the daily sweep.
      - key: STATES_ENABLED
        value: "0"
